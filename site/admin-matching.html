<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andjix — Admin Matching</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #f0f4f1; min-height: 100vh; }

  .header {
    background: #0a1628;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo { font-family: 'Playfair Display', serif; font-size: 20px; color: #d4a84b; letter-spacing: 1px; }
  .logo span { font-family: 'DM Sans', sans-serif; font-size: 10px; color: #a09080; display: block; letter-spacing: 2px; text-transform: uppercase; }
  .header-tag { background: #1d9e75; color: #fff; font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; padding: 5px 12px; border-radius: 2px; }

  .toolbar {
    background: #fff;
    border-bottom: 1px solid #dde8e2;
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .btn {
    padding: 9px 20px;
    border: none;
    border-radius: 3px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .8px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: background .2s;
  }
  .btn-primary { background: #1d9e75; color: #fff; }
  .btn-primary:hover { background: #0f6e56; }
  .btn-primary:disabled { background: #9fd4b8; cursor: not-allowed; }
  .btn-secondary { background: #e8f2ee; color: #1d9e75; border: 1px solid #9fd4b8; }
  .btn-secondary:hover { background: #d2eae0; }

  .status-bar {
    font-size: 12px;
    color: #7a9a8a;
    margin-left: auto;
  }
  .status-bar span { color: #1d9e75; font-weight: 500; }

  .container { max-width: 1100px; margin: 32px auto; padding: 0 24px 60px; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: #fff;
    border: 1px solid #dde8e2;
    border-radius: 4px;
    padding: 18px 20px;
    text-align: center;
  }
  .stat-card .num { font-family: 'Playfair Display', serif; font-size: 32px; color: #1d9e75; }
  .stat-card .label { font-size: 11px; color: #7a9a8a; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #1d9e75;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid #e8f2ee;
  }

  .employer-block {
    background: #fff;
    border: 1px solid #dde8e2;
    border-radius: 4px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .employer-header {
    background: #0a1628;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }
  .employer-header h3 { color: #f0ece3; font-size: 15px; font-weight: 500; }
  .employer-meta { display: flex; gap: 12px; align-items: center; }
  .badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 2px;
  }
  .badge-green { background: #1d9e75; color: #fff; }
  .badge-gold { background: #d4a84b; color: #0a1628; }
  .badge-grey { background: #3a5248; color: #a0b8b0; }
  .chevron { color: #a09080; font-size: 12px; transition: transform .2s; }
  .chevron.open { transform: rotate(180deg); }

  .employer-details {
    padding: 14px 20px;
    background: #f7faf8;
    border-bottom: 1px solid #e8f2ee;
    font-size: 12px;
    color: #3a5248;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }
  .employer-details strong { color: #0a1628; }

  .matches-list { padding: 16px 20px; display: none; }
  .matches-list.visible { display: block; }

  .no-match {
    text-align: center;
    padding: 24px;
    color: #a09080;
    font-size: 13px;
    font-style: italic;
  }

  .match-card {
    border: 1px solid #dde8e2;
    border-radius: 3px;
    padding: 14px 16px;
    margin-bottom: 12px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: start;
  }
  .match-card.score-7 { border-left: 4px solid #1d9e75; }
  .match-card.score-6 { border-left: 4px solid #2db88a; }
  .match-card.score-5 { border-left: 4px solid #d4a84b; }
  .match-card.score-4 { border-left: 4px solid #e0c070; }

  .match-name { font-size: 15px; font-weight: 500; color: #0a1628; margin-bottom: 4px; }
  .match-info { font-size: 12px; color: #3a5248; margin-bottom: 8px; }
  .match-info a { color: #1d9e75; text-decoration: none; }

  .criteres { display: flex; flex-wrap: wrap; gap: 6px; }
  .critere-tag {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 2px;
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
    background: #e8f5ef;
    color: #0f6e56;
    border: 1px solid #9fd4b8;
  }

  .score-display {
    text-align: center;
    min-width: 60px;
  }
  .score-num { font-family: 'Playfair Display', serif; font-size: 28px; color: #1d9e75; line-height: 1; }
  .score-label { font-size: 10px; color: #7a9a8a; text-transform: uppercase; letter-spacing: 1px; }

  .btn-alert {
    font-size: 10px;
    padding: 5px 12px;
    background: #fff3cd;
    border: 1px solid #d4a84b;
    color: #7a5c00;
    border-radius: 2px;
    cursor: pointer;
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
    font-family: 'DM Sans', sans-serif;
    margin-top: 6px;
    transition: background .2s;
  }
  .btn-alert:hover { background: #ffe8a0; }
  .btn-alert:disabled { opacity: .5; cursor: not-allowed; }

  .loading {
    text-align: center;
    padding: 60px;
    color: #7a9a8a;
    font-size: 14px;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #e8f2ee;
    border-top-color: #1d9e75;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .alert-global {
    padding: 12px 18px;
    border-radius: 3px;
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
  }
  .alert-global.success { background: #e8f5ef; border: 1px solid #1d9e75; color: #0f6e56; }
  .alert-global.error { background: #fdecea; border: 1px solid #e57373; color: #b71c1c; }

  @media (max-width: 600px) {
    .stats-row { grid-template-columns: 1fr 1fr; }
    .toolbar { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">ANDJIX <span>Consulting Inc.</span></div>
  </div>
  <div class="header-tag">Admin — Matching</div>
</div>

<div class="toolbar">
  <button class="btn btn-primary" id="btn-run" onclick="lancerMatching()">&#9654; Lancer le matching</button>
  <button class="btn btn-secondary" onclick="exporterCSV()" id="btn-export" style="display:none">&#8595; Exporter CSV</button>
  <div class="status-bar" id="status-bar">Prêt.</div>
</div>

<div class="container">

  <div id="alert-global" class="alert-global"></div>

  <div class="stats-row" id="stats-row" style="display:none">
    <div class="stat-card"><div class="num" id="stat-emp">—</div><div class="label">Employeurs actifs</div></div>
    <div class="stat-card"><div class="num" id="stat-cand">—</div><div class="label">Candidats disponibles</div></div>
    <div class="stat-card"><div class="num" id="stat-matches">—</div><div class="label">Matches ≥ 4/7</div></div>
    <div class="stat-card"><div class="num" id="stat-parfait">—</div><div class="label">Matches parfaits 7/7</div></div>
  </div>

  <div id="resultats"></div>

</div>

<!-- EmailJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="config.js"></script>
<script src="matching.js"></script>
<script>

emailjs.init(EMAILJS_PUBLIC_KEY);

// ─── Récupération Airtable ─────────────────────────────────────────────────

async function fetchAll(table, filterFormula) {
  const records = [];
  let offset = null;
  do {
    let url = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${encodeURIComponent(table)}?pageSize=100`;
    if (filterFormula) url += `&filterByFormula=${encodeURIComponent(filterFormula)}`;
    if (offset) url += `&offset=${offset}`;
    const res = await fetch(url, {
      headers: { 'Authorization': `Bearer ${AIRTABLE_API_KEY}` }
    });
    if (!res.ok) throw new Error(`Erreur Airtable [${res.status}] sur ${table}`);
    const data = await res.json();
    records.push(...data.records);
    offset = data.offset || null;
  } while (offset);
  return records;
}

// ─── Matching principal ────────────────────────────────────────────────────

let derniersResultats = [];

async function lancerMatching() {
  const btn = document.getElementById('btn-run');
  const statusBar = document.getElementById('status-bar');
  const resultats = document.getElementById('resultats');
  const alertGlobal = document.getElementById('alert-global');

  btn.disabled = true;
  alertGlobal.style.display = 'none';
  resultats.innerHTML = `<div class="loading"><div class="spinner"></div>Chargement des données Airtable...</div>`;

  try {
    statusBar.innerHTML = 'Chargement employeurs...';
    const employeurs = await fetchAll(AIRTABLE_EMPLOYEURS, `{Statut}="Actif"`);

    statusBar.innerHTML = 'Chargement candidats...';
    const candidats = await fetchAll(AIRTABLE_CANDIDATS, `{Statut}="Disponible"`);

    statusBar.innerHTML = 'Calcul des matches...';
    derniersResultats = [];

    let totalMatches = 0;
    let totalParfait = 0;

    const blocs = employeurs.map(emp => {
      const matches = matchCandidats(emp, candidats);
      derniersResultats.push({ employeur: emp, matches });
      totalMatches += matches.length;
      totalParfait += matches.filter(m => m.score === 7).length;
      return { employeur: emp, matches };
    });

    // Mise à jour stats
    document.getElementById('stats-row').style.display = 'grid';
    document.getElementById('stat-emp').textContent = employeurs.length;
    document.getElementById('stat-cand').textContent = candidats.length;
    document.getElementById('stat-matches').textContent = totalMatches;
    document.getElementById('stat-parfait').textContent = totalParfait;

    // Rendu
    resultats.innerHTML = `<div class="section-title">Résultats par employeur</div>` +
      blocs.map((b, i) => renderEmployeurBloc(b.employeur, b.matches, i)).join('');

    document.getElementById('btn-export').style.display = totalMatches > 0 ? 'inline-block' : 'none';
    statusBar.innerHTML = `Terminé — <span>${totalMatches} match(es) trouvé(s)</span>`;

  } catch (err) {
    resultats.innerHTML = '';
    alertGlobal.className = 'alert-global error';
    alertGlobal.textContent = '✗ ' + err.message;
    alertGlobal.style.display = 'block';
    statusBar.innerHTML = 'Erreur.';
  } finally {
    btn.disabled = false;
  }
}

// ─── Rendu HTML ────────────────────────────────────────────────────────────

const CRITERE_LABELS = {
  secteur: 'Secteur', langue: 'Langue', contrat: 'Contrat',
  salaire: 'Salaire', disponibilite: 'Disponibilité'
};

function renderEmployeurBloc(emp, matches, idx) {
  const e = emp.fields || emp;
  const nbMatches = matches.length;
  const badgeClass = nbMatches >= 3 ? 'badge-green' : nbMatches >= 1 ? 'badge-gold' : 'badge-grey';

  return `
  <div class="employer-block">
    <div class="employer-header" onclick="toggleBloc(${idx})">
      <h3>${e['Nom entreprise'] || 'N/A'}</h3>
      <div class="employer-meta">
        <span class="badge ${badgeClass}">${nbMatches} match${nbMatches !== 1 ? 'es' : ''}</span>
        <span class="chevron" id="chevron-${idx}">&#9660;</span>
      </div>
    </div>
    <div class="employer-details">
      <div><strong>Secteur :</strong> ${e['Secteur'] || '—'}</div>
      <div><strong>Poste :</strong> ${e['Postes recherchés'] || '—'}</div>
      <div><strong>Contrat :</strong> ${(e['Type contrat'] || []).join(', ') || '—'}</div>
      <div><strong>Salaire :</strong> ${e['Salaire offert'] || '—'}</div>
      <div><strong>Délai :</strong> ${e['Délai recrutement'] || '—'}</div>
      <div><strong>Langues :</strong> ${(e['Langues requises'] || []).join(', ') || '—'}</div>
    </div>
    <div class="matches-list visible" id="matches-${idx}">
      ${nbMatches === 0
        ? `<div class="no-match">Aucun candidat disponible avec un score ≥ 4/7 pour cet employeur.</div>`
        : matches.map(m => renderMatchCard(m)).join('')
      }
    </div>
  </div>`;
}

function renderMatchCard({ candidat, score, criteres_matches }) {
  const c = candidat.fields || candidat;
  const cls = `score-${Math.min(score, 7)}`;
  const criteresTags = Object.keys(criteres_matches)
    .map(k => `<span class="critere-tag">${CRITERE_LABELS[k]}</span>`)
    .join('');
  const candidatId = candidat.id || '';

  return `
  <div class="match-card ${cls}">
    <div>
      <div class="match-name">${c['Prénom'] || ''} ${c['Nom'] || ''}</div>
      <div class="match-info">
        Poste : ${c['Poste recherché'] || '—'} &nbsp;|&nbsp;
        Dispo : ${c['Disponibilité'] || '—'} &nbsp;|&nbsp;
        <a href="tel:${c['Téléphone'] || ''}">${c['Téléphone'] || '—'}</a> &nbsp;|&nbsp;
        <a href="mailto:${c['Courriel'] || ''}">${c['Courriel'] || '—'}</a>
      </div>
      <div class="criteres">${criteresTags}</div>
    </div>
    <div class="score-display">
      <div class="score-num">${score}</div>
      <div class="score-label">/ 7</div>
    </div>
  </div>`;
}

// ─── Toggle accordéon ──────────────────────────────────────────────────────

function toggleBloc(idx) {
  const list = document.getElementById(`matches-${idx}`);
  const chevron = document.getElementById(`chevron-${idx}`);
  list.classList.toggle('visible');
  chevron.classList.toggle('open');
}

// ─── Envoyer toutes les alertes ────────────────────────────────────────────

async function envoyerToutesAlertes() {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Envoi...';
  for (const { employeur, matches } of derniersResultats) {
    if (matches.length > 0) await sendMatchAlert(employeur, matches);
  }
  btn.textContent = '✓ Alertes envoyées';
}

// ─── Export CSV ────────────────────────────────────────────────────────────

function exporterCSV() {
  const lignes = [['Employeur', 'Candidat', 'Score', 'Critères matchés', 'Téléphone', 'Courriel']];
  for (const { employeur, matches } of derniersResultats) {
    const e = employeur.fields || employeur;
    for (const { candidat, score, criteres_matches } of matches) {
      const c = candidat.fields || candidat;
      lignes.push([
        e['Nom entreprise'] || '',
        `${c['Prénom'] || ''} ${c['Nom'] || ''}`,
        score,
        Object.keys(criteres_matches).map(k => CRITERE_LABELS[k]).join(' / '),
        c['Téléphone'] || '',
        c['Courriel'] || ''
      ]);
    }
  }
  const csv = lignes.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `andjix-matches-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

</script>
</body>
</html>
